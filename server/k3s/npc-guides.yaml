apiVersion: v1
kind: ConfigMap
metadata:
  name: zorx-npc-guides
  namespace: zorx-staging
data:
  npc_guides.json: |
    {
      "version": 1,
      "guides": {
        "default": {
          "title": "วิธีใช้งาน",
          "body": "เลือกเมนูที่ต้องการ แล้วเลือกไอเทมหรือตัวเลือก\nอ่านรายละเอียดและค่าใช้จ่ายก่อนยืนยัน\nปุ่ม ! เปิดคำแนะนำ · ปุ่ม × ปิดหน้าต่าง",
          "confirm": "เข้าใจแล้ว"
        },
        "blacksmith": {
          "title": "วิธีใช้งาน Blacksmith",
          "body": "เลือกแท็บ แล้วแตะหรือลากอุปกรณ์ลงช่อง\nRepair · ซ่อมความทนทานของอุปกรณ์\nตรวจราคาและวัตถุดิบก่อนกดซ่อม\nRefine · เพิ่มออฟหลัก ATK / DEF / HP\nแต่ละ + เพิ่ม 1.3% ของค่า Base เดิม สูงสุด +12\nครั้งละ 100 Gold · ตั้งแต่ +4 มีโอกาสล้มเหลว\nดูโอกาสสำเร็จและผลเมื่อล้มเหลวก่อนยืนยัน\nUpgrade · พัฒนาออฟรอง ครั้งละ 100 Gold\nออฟไม่ครบ 4 แถว: สุ่มเพิ่มออฟใหม่ 1 แถว\nครบ 4 แถว: สุ่มเพิ่มค่าออฟเดิม 1 แถว\nกดได้รวม 5 ครั้งต่อชิ้น รวมครั้งที่เพิ่มแถวใหม่\nโบนัสแสดงในวงเล็บ (+ค่า) หลังค่าดั้งเดิม",
          "confirm": "เข้าใจแล้ว"
        },
        "merchant": {
          "title": "วิธีใช้งาน Merchant",
          "body": "ขวาคือกระเป๋า · ซ้ายคือกองรอขาย\nลากของไปกองซ้ายเพื่อเลือกไว้ก่อน ยังไม่ขายทันที\nลากกลับฝั่งขวา หรือกดคืนทั้งหมดเพื่อยกเลิก\nแตะของแล้วกดใส่กอง / คืนกระเป๋าได้เช่นกัน\nเลือกครบแล้วกดขายทั้งกอง และยืนยันยอดรวม\nอุปกรณ์ราคาตาม Tier · วัตถุดิบคิดตามจำนวน\nของที่สวมใส่ต้องถอด ของในคลังต้องถอนก่อน\nขายแล้วนำของคืนไม่ได้",
          "confirm": "เข้าใจแล้ว"
        },
        "storage": {
          "title": "วิธีใช้งาน Storage",
          "body": "ซ้ายคือคลังเก็บของ · ขวาคือกระเป๋า\nลากอุปกรณ์หรือวัตถุดิบข้ามฝั่งเพื่อฝาก / ถอน\nหรือแตะของ แล้วกดปุ่มฝาก / ถอนด้านล่าง\nของที่สวมใส่ต้องถอดเข้ากระเป๋าก่อนฝาก\nคลังเริ่มต้นมี 20 ช่อง · ตรวจช่องว่างก่อนย้าย\nรอข้อความยืนยันจากเซิร์ฟเวอร์ก่อนย้ายต่อ\nหากข้อมูลไม่ตรง กดโหลดข้อมูลล่าสุด",
          "confirm": "เข้าใจแล้ว"
        },
        "customize": {
          "title": "วิธีปรับตัวละคร",
          "body": "เลือกหมวดใบหน้า ทรงผม หรือสีผิว\nแตะตัวเลือกเพื่อดูบนตัวละคร\nตัวเลือกที่สำเร็จจะบันทึกให้ทันที\nไม่ต้องกดปุ่มบันทึกเพิ่มเติม\nการแต่งหน้าตาไม่เพิ่มค่าสถานะอุปกรณ์",
          "confirm": "เข้าใจแล้ว"
        },
        "world_map": {
          "title": "วิธีออกเดินทาง",
          "body": "ผลึกซ้ายบนคือแคมป์ที่เราอยู่\nฐาน Orc อยู่บริเวณกลางแผนที่\nเลือก Journey หรือ Farm แล้วเลือกปลายทาง\nตรวจพื้นที่และโหมด ก่อนกดออกเดินทาง\nพื้นที่ที่หมอกคลุมยังไม่เปิดให้เข้า\nห้องสมบัติต้องเปิดกล่องก่อน วาปถัดไปจึงปรากฏ",
          "confirm": "เข้าใจแล้ว"
        }
      }
    }
