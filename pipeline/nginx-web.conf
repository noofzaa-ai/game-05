server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index play.html;

    # Packs are already gzip-wrapped and the game loader unwraps them.
    # Do not label the stored bytes Content-Encoding:gzip or compress again.
    gzip off;
    gzip_static off;

    location = /config/npc_guides.json {
        alias /etc/zorx-public/npc_guides.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Browser entry and mutable manifest/loader must pick up new releases.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /play.html =404;
    }
    # PWA (Add to Home Screen). The manifest and worker are mutable (no-cache); the worker needs scope "/".
    # sw.js only caches offline.html, the manifest and the icons, never play.html, packs.json or any pack.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /sw.js {
        types { }
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }
    location ~ "^/(?:icon-192|icon-512|icon-maskable-512|apple-touch-icon)\.png$" {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location ~ "\.[0-9a-f]{12}\.(?:pck\.)?wasm$" {
        types { application/wasm wasm; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
