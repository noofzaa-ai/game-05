server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index play.html;

    # Packs are already gzip-wrapped and the game loader unwraps them.
    # Do not label the stored bytes Content-Encoding:gzip or compress again.
    gzip off;
    gzip_static off;

    location = /config/npc_guides.json {
        alias /etc/zorx-public/npc_guides.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Browser entry and mutable manifest/loader must pick up new releases.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /play.html =404;
    }
    location ~ "\.[0-9a-f]{12}\.(?:pck\.)?wasm$" {
        types { application/wasm wasm; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
