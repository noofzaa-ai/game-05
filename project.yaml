# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.3.0
  last_upgraded: 2026-11-09

# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so the rigor `/start` infers
# and saves would stop changing anything. `/start` states the same rule for the
# settings it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/project-settings --local <key>=<value>` writes there; `/project-settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.

# --- zorx (set 2026-11-11) ---------------------------------------------------
# Standard flow chosen by Boss. `modes.rigor` fronts the six knobs listed above; never add them here.
modes:
  rigor: standard
  automation: guided   # Boss 2026-11-11: decide small things, ask on big/irreversible ones

project:
  goal: hobby   # Boss 2026-11-11: hobby / portfolio; an auto-battler for web (PC + mobile)

engine:
  name: "Godot"
  version: "4.7.2"
  language: "GDScript"
  rendering: "GL Compatibility"   # web export; see docs/tech/
  # Our game code lives in logic/ (rules, no nodes) and client/ (views). The framework takes one folder, so
  # the code scans (TODO/debt markers, commit checks) cover logic/. client/ is NOT scanned: see CLAUDE.md.
  code_root: "logic"
  test_root: "tests"

specialists:
  code: "godot-gdscript-specialist"
  shader: "godot-shader-specialist"
  ui: "godot-gdscript-specialist"

commands:
  # Our own runner (tests/run_all.gd), not gdUnit4. Baseline on 2026-11-11: 162 known failures; compare failure names, not counts.
  test: "godot --headless --path . --script res://tests/run_all.gd"
  run: "godot --path . --windowed"
  smoke: "godot --headless --path . --quit-after 5"

# The session-start update notice reads a cache refreshed over the network; keep that off (Boss/security default).
updates:
  check: false
